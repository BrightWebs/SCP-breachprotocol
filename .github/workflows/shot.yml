name: Screenshot a preview page
on:
  workflow_dispatch:
jobs:
  shot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
      - name: Shots
        run: |
          mkdir out
          for i in 0 1 2 3; do
            google-chrome --headless=new --no-sandbox --use-angle=swiftshader --enable-unsafe-swiftshader --window-size=1000,900 \
              --virtual-time-budget=6000 --screenshot=out/shot$i.png "file://$PWD/preview/index.html#shot-$i" || true
          done
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: shots
          path: out
