name: Screenshot a preview page
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  shot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
      - name: Shots
        run: |
          mkdir -p shots
          for i in 0 1 2 3 4 5; do
            google-chrome --headless=new --no-sandbox --use-angle=swiftshader --enable-unsafe-swiftshader --window-size=1000,900 \
              --virtual-time-budget=6000 --screenshot=shots/shot$i.png "file://$PWD/preview/index.html#shot-$i" || true
          done
          git config user.name shots; git config user.email shots@users.noreply.github.com
          git add shots && git commit -m "shots" && git push || true
