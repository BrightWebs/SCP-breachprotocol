name: Screenshot a preview page
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  shot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
      - name: Shots
        run: |
          mkdir -p shots
          for h in tf-0.1 tf-0.25 tf-0.42 tf-0.6 tf-0.75 tf-0.93 pose-hover-none; do
            google-chrome --headless=new --no-sandbox --use-angle=swiftshader --enable-unsafe-swiftshader --window-size=1000,900 \
              --virtual-time-budget=6000 --screenshot=shots/$h.png "file://$PWD/preview/index.html#$h" || true
          done
          git config user.name shots; git config user.email shots@users.noreply.github.com
          git add shots && git commit -m "shots" && git push || true
