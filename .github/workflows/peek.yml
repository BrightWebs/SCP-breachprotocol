name: Peek at a mod's numbers
on:
  workflow_dispatch:
    inputs:
      slug:
        description: Modrinth project slug
        required: true
      grep:
        description: Path pattern of files to print
        required: true
      file:
        description: One file to print line ranges of
        required: false
      ranges:
        description: sed ranges, e.g. 295,470p;1470,1540p
        required: false
jobs:
  peek:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch and print matching files (nothing is kept)
        run: |
          set -e
          curl -s "https://api.modrinth.com/v2/project/${{ inputs.slug }}/version" > v.json
          python3 - <<'PY'
          import json
          v=json.load(open('v.json'))
          for x in v[:12]: print(x['version_number'], x['loaders'], x['game_versions'][:3], x['files'][0]['filename'])
          f=[x for x in v if 'forge' in x['loaders']] or v
          open('url','w').write(f[0]['files'][0]['url'])
          print('USING', f[0]['files'][0]['filename'])
          PY
          curl -sL "$(cat url)" -o mod.jar
          mkdir x && cd x && unzip -q ../mod.jar
          if [ -n "${{ inputs.file }}" ]; then
            for c in ${{ inputs.file }}; do
              case "$c" in *.class) echo "== javap $c =="; javap -p -s -cp . "${c%.class}" | head -400 ;; *) echo "== $c =="; sed -n "${{ inputs.ranges }}" "$c" | cat -n ;; esac
            done
            exit 0
          fi
          echo "== matching files =="
          find . -type f | grep -iE "${{ inputs.grep }}" | head -200
          echo "== contents =="
          for f in $(find . -type f \( -name '*.json' -o -name '*.js' -o -name '*.toml' -o -name '*.mcfunction' \) | grep -iE "${{ inputs.grep }}" | grep -v animations | head -60); do echo "---- $f"; head -c 6000 "$f"; echo; done
          echo "== files mentioning SpeedLevel / movement_speed =="
          grep -rlE "SpeedLevel|movement_speed|flying_speed" --include=*.json --include=*.js --include=*.mcfunction . | grep -v animations | head -40
          echo "== those lines =="
          grep -rnE "SpeedLevel|movement_speed|\"amount\"|\"value\"|operation|speed" --include=*.json --include=*.js --include=*.mcfunction . | grep -v -e animations -e textures -e "/models/" | grep -iE "kinec|xlr8|alien_4|speed" | head -250
